<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veckans Smaskiga Matplan</title>
<style>
  [hidden] { display: none !important; }
  img { max-width: 100%; }
  :root {
    --bg: #F6F5F0;
    --surface: #FFFFFF;
    --surface-2: #EFEEE7;
    --text: #232A24;
    --text-muted: #5B6459;
    --accent: #3F6B4F;
    --accent-ink: #FFFFFF;
    --accent-soft: #E3EEE6;
    --amber: #B4791F;
    --amber-soft: #F5E9D6;
    --border: #DCE0D8;
    --danger: #A23B33;
    --danger-soft: #F5E1DE;
    --shadow: 0 1px 2px rgba(35,42,36,0.06), 0 6px 20px -12px rgba(35,42,36,0.25);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14180F;
      --surface: #1C2118;
      --surface-2: #232920;
      --text: #EAEDE6;
      --text-muted: #9CA894;
      --accent: #74A987;
      --accent-ink: #0E140F;
      --accent-soft: #26352A;
      --amber: #D7A24E;
      --amber-soft: #332A19;
      --border: #313828;
      --danger: #D98A80;
      --danger-soft: #3A2420;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px -12px rgba(0,0,0,0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14180F;
    --surface: #1C2118;
    --surface-2: #232920;
    --text: #EAEDE6;
    --text-muted: #9CA894;
    --accent: #74A987;
    --accent-ink: #0E140F;
    --accent-soft: #26352A;
    --amber: #D7A24E;
    --amber-soft: #332A19;
    --border: #313828;
    --danger: #D98A80;
    --danger-soft: #3A2420;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px -12px rgba(0,0,0,0.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Work Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    padding-inline: 16px;
    padding-block: 20px 48px;
  }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; text-wrap: balance; margin: 0; }
  a { color: var(--accent); }

  .wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  header.top { display: flex; flex-direction: column; gap: 4px; }
  header.top h1 { font-size: 1.9rem; font-weight: 600; letter-spacing: -0.01em; }
  header.top p { margin: 0; color: var(--text-muted); font-size: 0.92rem; }

  nav.tabs {
    display: flex; gap: 4px; background: var(--surface-2); padding: 4px;
    border-radius: 12px; width: fit-content; max-width: 100%;
  }
  nav.tabs button {
    font: inherit; font-weight: 600; font-size: 0.88rem; border: none; cursor: pointer;
    padding: 8px 16px; border-radius: 9px; background: transparent; color: var(--text-muted);
    transition: background .15s, color .15s;
  }
  nav.tabs button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  .panel { display: flex; flex-direction: column; gap: 16px; }
  .panel[hidden] { display: none; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .search {
    flex: 1 1 200px; min-width: 0; font: inherit; font-size: 0.9rem; padding: 9px 12px;
    border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  select.sortsel {
    font: inherit; font-size: 0.85rem; padding: 9px 10px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  .btn {
    font: inherit; font-weight: 600; font-size: 0.88rem; border-radius: 9px; cursor: pointer;
    padding: 9px 15px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.danger { color: var(--danger); }
  .btn.small { padding: 5px 10px; font-size: 0.78rem; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .tagrow { display: flex; flex-wrap: wrap; gap: 6px; }
  .tagchip {
    font-size: 0.76rem; font-weight: 600; padding: 4px 10px; border-radius: 100px;
    background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; cursor: pointer;
  }
  .tagchip.on { background: var(--accent); color: var(--accent-ink); }
  .tagchip.static { cursor: default; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
  }
  .card h3 { font-size: 1.08rem; font-weight: 600; }
  .card .meta { font-size: 0.78rem; color: var(--text-muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .card .actions { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .card .thumb {
    width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px;
    background: var(--surface-2); margin-bottom: 2px;
  }

  .img-field { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .img-field .preview {
    width: 84px; height: 84px; border-radius: 10px; object-fit: cover;
    background: var(--surface-2); border: 1px solid var(--border); flex-shrink: 0;
  }
  .img-field .preview.empty { display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 0.72rem; text-align: center; padding: 6px; }
  .img-field .controls { display: flex; flex-direction: column; gap: 6px; }

  .detail-modal { max-width: 760px; }
  .detail-img { width: 100%; max-height: 340px; object-fit: cover; border-radius: 12px; background: var(--surface-2); }
  .detail-cols { display: flex; gap: 24px; flex-wrap: wrap; }
  .detail-cols > div { flex: 1 1 240px; min-width: 0; }
  .detail-cols h3 { font-size: 1rem; margin-bottom: 8px; }
  .detail-cols ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 0.92rem; }
  .detail-cols .ing-group-label { font-size: 0.82rem; font-weight: 600; color: var(--text-muted); margin: 10px 0 4px; }
  .detail-cols .ing-group-label:first-child { margin-top: 0; }
  .detail-cols .instructions { font-size: 0.92rem; line-height: 1.5; }
  .detail-cols .instructions ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
  .detail-notes h3 { font-size: 1rem; margin-bottom: 8px; }
  .detail-notes p { font-size: 0.92rem; white-space: pre-wrap; line-height: 1.5; }

  .rating { display: flex; flex-wrap: wrap; gap: 16px; }
  .rating-person { display: flex; align-items: center; gap: 4px; }
  .rating-label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); margin-right: 2px; }
  .rating-pigs { display: flex; gap: 1px; }
  .rating-pigs .pig {
    background: none; border: none; cursor: pointer; padding: 2px; font-size: 1.05rem;
    line-height: 1; opacity: 0.3; filter: grayscale(1); transition: opacity .15s, filter .15s;
  }
  .rating-pigs .pig.on { opacity: 1; filter: none; }
  .rating-pigs .pig:hover { opacity: 0.8; }

  .weekcard {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; display: flex; align-items: flex-start; gap: 12px; cursor: pointer;
  }
  .weekcard.on { border-color: var(--accent); background: var(--accent-soft); }
  .weekcard input[type=checkbox] { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--accent); flex-shrink: 0; }
  .weekcard .body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .weekcard h3 { font-size: 1rem; font-weight: 600; }

  .empty {
    border: 1px dashed var(--border); border-radius: 14px; padding: 28px 16px;
    text-align: center; color: var(--text-muted); font-size: 0.9rem;
  }

  .shoplist {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow);
  }
  .shoplist .cathead {
    font-family: "Fraunces", serif; font-size: 0.95rem; font-weight: 600; color: var(--amber);
    border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 6px;
  }
  .shoplist ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .shoplist li {
    display: flex; align-items: baseline; gap: 8px; font-size: 0.92rem; padding: 5px 2px; border-radius: 6px;
  }
  .shoplist li input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; flex-shrink: 0; }
  .shoplist li.checked span { text-decoration: line-through; color: var(--text-muted); }
  .shoplist .qty { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text-muted); min-width: 3.2em; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(20,24,15,0.45); display: flex; align-items: flex-start;
    justify-content: center; padding: 24px 16px; overflow-y: auto; z-index: 10;
  }
  .modal {
    background: var(--surface); border-radius: 16px; padding: 22px; width: 100%; max-width: 560px;
    display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); margin-block: auto;
  }
  .modal h2 { font-size: 1.3rem; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); }
  .field input, .field textarea {
    font: inherit; font-size: 0.92rem; padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); width: 100%;
  }
  .field textarea { resize: vertical; min-height: 56px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .ing-row {
    display: grid; grid-template-columns: 1.4fr 0.6fr 0.7fr 1fr 0.9fr auto; gap: 6px; align-items: center;
  }
  .ing-row input, .ing-row select {
    font: inherit; font-size: 0.85rem; padding: 7px 8px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); width: 100%;
  }
  .ing-row button {
    background: none; border: 1px solid var(--border); border-radius: 7px; color: var(--danger);
    cursor: pointer; font-size: 0.78rem; padding: 7px 8px; white-space: nowrap;
  }
  .ing-head { display: grid; grid-template-columns: 1.4fr 0.6fr 0.7fr 1fr 0.9fr auto; gap: 6px; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

  .modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; }
  .modal-actions .right { display: flex; gap: 8px; }

  .banner {
    border-radius: 10px; padding: 10px 14px; font-size: 0.86rem; display: flex; justify-content: space-between; gap: 10px; align-items: center;
  }
  .banner.error { background: var(--danger-soft); color: var(--danger); }
  .banner.info { background: var(--amber-soft); color: var(--amber); }
  .banner button { background: none; border: none; color: inherit; font-weight: 700; cursor: pointer; }

  .loading { color: var(--text-muted); font-size: 0.9rem; padding: 20px; text-align: center; }

  @media (max-width: 480px) {
    .row2 { grid-template-columns: 1fr; }
    .ing-row {
      grid-template-columns: 1fr;
      border: 1px solid var(--border); border-radius: 10px; padding: 10px;
      background: var(--surface-2);
    }
    .ing-row button {
      justify-self: end; width: auto; font-size: 0.8rem; padding: 6px 10px;
      border: 1px solid var(--border); border-radius: 7px; margin-top: 2px;
    }
    .ing-head { display: none; }
  }
</style>

<body>

<div class="wrap">
  <header class="top">
    <h1>Veckans Smaskiga Matplan</h1>
    <p>Välj middagar och inköpslistan skapas automatiskt.</p>
  </header>

  <div id="banners"></div>

  <nav class="tabs">
    <button data-tab="recipes" class="active">Recept</button>
    <button data-tab="week">Veckoplan</button>
    <button data-tab="history">Historik</button>
  </nav>

  <section class="panel" id="panel-recipes">
    <div class="toolbar">
      <input class="search" id="recipeSearch" type="text" placeholder="Sök recept…">
      <select class="sortsel" id="recipeSort">
        <option value="name">Namn (A–Ö)</option>
        <option value="stale">Inte lagad på länge</option>
        <option value="new">Senast tillagda</option>
      </select>
      <button class="btn primary" id="newRecipeBtn">+ Nytt recept</button>
    </div>
    <div class="tagrow" id="tagFilterRow"></div>
    <div id="recipeGrid" class="grid"></div>
  </section>

  <section class="panel" id="panel-week" hidden>
    <div class="toolbar">
      <input class="search" id="weekSearch" type="text" placeholder="Sök bland recepten…">
      <label style="display:flex;align-items:center;gap:6px;font-size:0.82rem;color:var(--text-muted);white-space:nowrap;">
        Veckostart
        <input type="date" id="weekStartInput" class="sortsel">
      </label>
      <span style="font-size:0.85rem;color:var(--text-muted);white-space:nowrap;" id="weekCount">0 valda</span>
      <button class="btn small" id="resetWeekBtn" title="Avmarkera valda recept och kryssade varor">Återställ</button>
    </div>
    <div id="weekList" class="grid" style="grid-template-columns: 1fr;"></div>

    <div id="shopWrap" hidden>
      <h2 style="font-size:1.2rem;margin-bottom:10px;">Inköpslista</h2>
      <div id="shopList"></div>
      <div class="toolbar" style="margin-top:12px;">
        <button class="btn" id="copyListBtn">Kopiera lista</button>
        <button class="btn primary" id="savePlanBtn">Spara veckoplan</button>
      </div>
    </div>
  </section>

  <section class="panel" id="panel-history" hidden>
    <div id="historyList" style="display:flex;flex-direction:column;gap:12px;"></div>
  </section>
</div>

<div id="modalRoot"></div>

<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://lmaqcrqkhtbnrfaifgxo.supabase.co";
  var SUPABASE_KEY = "sb_publishable_4_9dxXTjEmE3oYTBdQxCfg_MVSl2KlG";
  var API = SUPABASE_URL + "/rest/v1";
  var HEADERS = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
  };

  var CATEGORIES = ["Frukt & grönt", "Kött & fisk", "Mejeri & ägg", "Bröd", "Skafferi", "Kryddor", "Fryst", "Övrigt"];

  var state = {
    recipes: [],
    loading: true,
    activeTab: "recipes",
    recipeSearch: "",
    recipeSort: "name",
    weekSearch: "",
    activeTagFilter: null,
    selected: new Set(),
    checkedShop: new Set(),
    editing: null, // recipe object being edited, or {} for new
    banner: null,
    plans: [],
    plansLoading: true,
    weekStart: toISODate(mondayOf(new Date()))
  };

  function $(sel, root) { return (root || document).querySelector(sel); }
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function text(t) { return document.createTextNode(t); }
  function fmtDate(d) {
    if (!d) return null;
    var dt = new Date(d + "T00:00:00");
    return dt.toLocaleDateString("sv-SE", { day: "numeric", month: "short", year: "numeric" });
  }
  function daysAgo(d) {
    if (!d) return Infinity;
    return (Date.now() - new Date(d + "T00:00:00").getTime()) / 86400000;
  }
  function esc(s) { return String(s == null ? "" : s); }

  function mondayOf(dateObj) {
    var d = new Date(dateObj);
    var day = d.getDay(); // 0 = söndag .. 6 = lördag
    var diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d;
  }
  function toISODate(d) {
    var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }
  function isoWeekNumber(dateObj) {
    var d = new Date(Date.UTC(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()));
    var dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  }
  function weekRangeLabel(weekStartStr) {
    if (!weekStartStr) return null;
    var start = new Date(weekStartStr + "T00:00:00");
    var end = new Date(start);
    end.setDate(end.getDate() + 6);
    var wk = isoWeekNumber(start);
    var fmt = function (d) { return d.toLocaleDateString("sv-SE", { day: "numeric", month: "short" }); };
    return "Vecka " + wk + " · " + fmt(start) + "–" + fmt(end);
  }

  function showBanner(kind, msgText) {
    state.banner = { kind: kind, text: msgText };
    renderBanner();
  }
  function clearBanner() { state.banner = null; renderBanner(); }
  function renderBanner() {
    var host = $("#banners");
    host.innerHTML = "";
    if (!state.banner) return;
    host.appendChild(el("div", { class: "banner " + state.banner.kind }, [
      el("span", {}, [text(state.banner.text)]),
      el("button", { onclick: clearBanner }, [text("✕")])
    ]));
  }

  // ---------- data ----------

  function apiFetch(path, opts) {
    opts = opts || {};
    var headers = Object.assign({}, HEADERS, opts.headers || {});
    return fetch(API + path, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) {
          throw new Error("Databasfel (" + res.status + "): " + t.slice(0, 200));
        });
      }
      // PostgREST returns an empty body (with status 200/201/204 depending on
      // the request) unless "Prefer: return=representation" was sent, so we
      // can't key off status code alone — read as text and parse only if
      // there's actually something there.
      return res.text().then(function (t) {
        if (!t) return null;
        try { return JSON.parse(t); } catch (e) { return null; }
      });
    });
  }

  // Calls the Supabase Edge Function that does the actual recipe parsing
  // (server-side fetch of the url, or the AI vision call for a screenshot —
  // both need the Anthropic API key, which stays server-side as a secret).
  function callImportFunction(payload) {
    return fetch(SUPABASE_URL + "/functions/v1/import-recipe", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + SUPABASE_KEY,
        "apikey": SUPABASE_KEY
      },
      body: JSON.stringify(payload)
    }).then(function (res) {
      return res.text().then(function (t) {
        var data = null;
        try { data = JSON.parse(t); } catch (e) {}
        if (!res.ok || !data || data.error) {
          throw new Error((data && data.error) || ("Serverfel (" + res.status + ")"));
        }
        return data;
      });
    });
  }

  // Downscales an uploaded screenshot before sending it, to keep the AI call
  // fast and cheap — a full-resolution phone photo is overkill for reading
  // ingredient text.
  function resizeImageToBase64(file, maxDim) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          var dataUrl = canvas.toDataURL("image/jpeg", 0.85);
          resolve({ base64: dataUrl.split(",")[1], mediaType: "image/jpeg" });
        };
        img.onerror = function () { reject(new Error("Kunde inte läsa bilden.")); };
        img.src = reader.result;
      };
      reader.onerror = function () { reject(new Error("Kunde inte läsa filen.")); };
      reader.readAsDataURL(file);
    });
  }

  // Samma nedskalning som ovan, men som en Blob (för uppladdning till
  // Supabase Storage) i stället för en base64-sträng (för AI-anropet).
  function resizeImageToBlob(file, maxDim, quality) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          canvas.toBlob(function (blob) {
            if (!blob) { reject(new Error("Kunde inte bearbeta bilden.")); return; }
            resolve(blob);
          }, "image/jpeg", quality || 0.85);
        };
        img.onerror = function () { reject(new Error("Kunde inte läsa bilden.")); };
        img.src = reader.result;
      };
      reader.onerror = function () { reject(new Error("Kunde inte läsa filen.")); };
      reader.readAsDataURL(file);
    });
  }

  // Laddar upp en egen receptbild till Supabase Storage-bucketen
  // "recipe-images" (se migration 004) och returnerar den publika URL:en.
  function uploadRecipeImage(file) {
    return resizeImageToBlob(file, 1200, 0.82).then(function (blob) {
      var path = "recipe_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8) + ".jpg";
      return fetch(SUPABASE_URL + "/storage/v1/object/recipe-images/" + path, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + SUPABASE_KEY,
          "apikey": SUPABASE_KEY,
          "Content-Type": "image/jpeg"
        },
        body: blob
      }).then(function (res) {
        if (!res.ok) {
          return res.text().then(function (t) {
            throw new Error("Kunde inte ladda upp bilden (" + res.status + "): " + t.slice(0, 200));
          });
        }
        return SUPABASE_URL + "/storage/v1/object/public/recipe-images/" + path;
      });
    });
  }

  // ---------- derived ----------

  function allTags() {
    var s = new Set();
    state.recipes.forEach(function (r) { (r.tags || []).forEach(function (t) { s.add(t); }); });
    return Array.from(s).sort();
  }

  function filteredRecipes(list, searchVal, tagFilter) {
    var q = (searchVal || "").trim().toLowerCase();
    return list.filter(function (r) {
      if (tagFilter && (r.tags || []).indexOf(tagFilter) === -1) return false;
      if (!q) return true;
      if (r.name.toLowerCase().indexOf(q) !== -1) return true;
      return (r.recipe_ingredients || []).some(function (i) { return i.name.toLowerCase().indexOf(q) !== -1; });
    });
  }

  function sortedRecipes(list) {
    var arr = list.slice();
    if (state.recipeSort === "name") {
      arr.sort(function (a, b) { return a.name.localeCompare(b.name, "sv"); });
    } else if (state.recipeSort === "stale") {
      arr.sort(function (a, b) { return daysAgo(b.last_cooked_at) - daysAgo(a.last_cooked_at); });
    } else if (state.recipeSort === "new") {
      arr.sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
    }
    return arr;
  }

    renderTabs();
    renderRecipesPanel();
    renderWeekPanel();

  function renderTabs() {

  // Byggblock för ett betyg (grisnosar 🐽 1-5) för en person. getValue() läser
  // det aktuella värdet (null/undefined = inget betyg satt); onClick(newValue,
  // redraw) anropas när en grisnos klickas — newValue är null om man klickar
  // på den nos som redan är den högsta ifyllda (togglar av betyget), annars
  // antalet noshörn t.o.m. den klickade. Anroparen ansvarar för att spara
  // (direkt mot databasen för korten, eller i lokalt formulärtillstånd i
  // redigeringsläget) och sedan anropa redraw() för att uppdatera vyn.
  function renderRatingRow(label, getValue, onClick) {
    var pigsHost = el("span", { class: "rating-pigs" }, []);
    var row = el("div", { class: "rating-person" }, [
      el("span", { class: "rating-label" }, [text(label)]),
      pigsHost
    ]);
    function draw() {
      pigsHost.innerHTML = "";
      var val = getValue();
      for (var i = 1; i <= 5; i++) {
        (function (n) {
          var on = val !== null && val !== undefined && n <= val;
          var btn = el("button", {
            type: "button",
            class: "pig" + (on ? " on" : ""),
            title: n + " av 5 grisnosar",
            onclick: function () { onClick(n === val ? null : n, draw); }
          }, [text("🐽")]);
          pigsHost.appendChild(btn);
        })(i);
      }
    }
    draw();
    row.redraw = draw;
    return row;
  }

  function renderWeekPanel() {

  function toggleSelected(id) {

    renderWeekPanel();

  // Nollställer både vilka recept som är valda för veckan och vilka varor
  // som är ikryssade i inköpslistan — utan att röra sparad historik eller
  // själva recepten.
  function resetWeekSelection() {
    if (!state.selected.size && !state.checkedShop.size) return;
    state.selected = new Set();
    state.checkedShop = new Set();
    renderWeekPanel();
    showBanner("info", "Valda recept och ikryssade varor är återställda.");
  }

  function buildShoppingList() {
    var chosen = state.recipes.filter(function (r) { return state.selected.has(r.id); });
    var map = {}; // key -> {name, unit, amount, hasAmount, count, category}
    chosen.forEach(function (r) {
      (r.recipe_ingredients || []).forEach(function (ing) {
        var amt = ing.amount === null || ing.amount === undefined || ing.amount === "" ? null : Number(ing.amount);
        // Normalisera enhet: om en mängd finns men ingen enhet är angiven (äldre
        // recept, eller AI-tolkning som missat), räkna den som "st" så att t.ex.
        // "1 gul lök" i två olika recept slås ihop till en rad i stället för två.
        var unit = (ing.unit || "").trim();
        if (!unit && amt !== null && !isNaN(amt)) unit = "st";
        var key = ing.name.trim().toLowerCase() + "|" + unit.toLowerCase();
        if (!map[key]) {
          map[key] = { name: ing.name.trim(), unit: unit, amount: 0, hasAmount: false, count: 0, category: ing.category || "Övrigt" };
        }
        map[key].count += 1;
        if (amt !== null && !isNaN(amt)) { map[key].amount += amt; map[key].hasAmount = true; }
      });
    });
    var byCat = {};
    Object.keys(map).forEach(function (k) {
      var item = map[k];
      var cat = CATEGORIES.indexOf(item.category) === -1 ? "Övrigt" : item.category;
      if (!byCat[cat]) byCat[cat] = [];
      byCat[cat].push(item);
    });
    Object.keys(byCat).forEach(function (cat) {
      byCat[cat].sort(function (a, b) { return a.name.localeCompare(b.name, "sv"); });
    });
    return byCat;
  }

  function shopItemKey(item) { return item.name.toLowerCase() + "|" + item.unit.toLowerCase(); }

  function renderShoppingList() {
    var wrap = $("#shopWrap");
    var host = $("#shopList");
    host.innerHTML = "";
    if (!state.selected.size) { wrap.hidden = true; return; }
    wrap.hidden = false;

    var byCat = buildShoppingList();
    var cats = CATEGORIES.filter(function (c) { return byCat[c]; });

    var container = el("div", { class: "shoplist" }, []);
    cats.forEach(function (cat) {
      container.appendChild(el("div", { class: "cathead" }, [text(cat)]));
      var ul = el("ul", {}, []);
      byCat[cat].forEach(function (item) {
        var key = shopItemKey(item);
        var checked = state.checkedShop.has(key);
        var qtyLabel = item.hasAmount
          ? (Math.round(item.amount * 100) / 100) + (item.unit ? " " + item.unit : " st")
          : (item.count > 1 ? "×" + item.count : "");
        var cb = el("input", { type: "checkbox" });
        cb.checked = checked;
        cb.addEventListener("change", function () {
          if (checked) state.checkedShop.delete(key); else state.checkedShop.add(key);
          renderShoppingList();
        });
        var li = el("li", { class: checked ? "checked" : "" }, [
          cb,
          el("span", { class: "qty" }, [text(qtyLabel)]),
          el("span", {}, [text(item.name)])
        ]);
        ul.appendChild(li);
      });
      container.appendChild(ul);
    });
    host.appendChild(container);
  }

  function copyShoppingList() {
    var byCat = buildShoppingList();
    var cats = CATEGORIES.filter(function (c) { return byCat[c]; });
    var lines = [];
    cats.forEach(function (cat) {
      lines.push(cat + ":");
      byCat[cat].forEach(function (item) {
        var qty = item.hasAmount ? (Math.round(item.amount * 100) / 100) + (item.unit ? " " + item.unit : " st") + " " : (item.count > 1 ? "×" + item.count + " " : "");
        lines.push("- " + qty + item.name);
      });
      lines.push("");
    });
    var out = lines.join("\n").trim();
    navigator.clipboard.writeText(out).then(function () {
      showBanner("info", "Inköpslistan kopierad.");
    }).catch(function () {
      showBanner("error", "Kunde inte kopiera automatiskt — markera texten manuellt.");
    });
  }

  function savePlan() {
    if (!state.selected.size) return;
    var ids = Array.from(state.selected);
    var today = new Date().toISOString().slice(0, 10);
    var weekStartField = $("#weekStartInput");
    var weekStart = (weekStartField && weekStartField.value) || state.weekStart;
    var label = weekRangeLabel(weekStart) || ("Vecka från " + fmtDate(weekStart));

    apiFetch("/weekly_plans", { method: "POST", body: { week_start: weekStart, week_label: label, recipe_ids: ids } })
      .then(function () {
        return apiFetch("/recipes?id=in.(" + ids.join(",") + ")", { method: "PATCH", body: { last_cooked_at: today } });
      })
      .then(function () {
        state.recipes.forEach(function (r) { if (ids.indexOf(r.id) !== -1) r.last_cooked_at = today; });
        return loadPlans();
      })
      .then(function () {
        showBanner("info", "Veckoplanen sparad i historiken. \"Senast lagad\" är uppdaterad.");
        render();
      })
      .catch(function (err) {
        showBanner("error", "Kunde inte spara veckoplanen. " + err.message);
      });
  }

  // ---------- render: history tab ----------

  function renderHistoryPanel() {
    var host = $("#historyList");
    if (!host) return;
    host.innerHTML = "";

    if (state.plansLoading) { host.appendChild(el("div", { class: "loading" }, [text("Hämtar historik…")])); return; }

    if (!state.plans.length) {
      host.appendChild(el("div", { class: "empty" }, [text("Inga sparade veckoplaner än. Spara en veckoplan under \"Veckoplan\" så dyker den upp här.")]));
      return;
    }

    state.plans.forEach(function (plan) {
      var label = weekRangeLabel(plan.week_start) || plan.week_label || (plan.created_at ? "Sparad " + fmtDate(plan.created_at.slice(0, 10)) : "Veckoplan");
      var planRecipes = (plan.recipe_ids || []).map(function (id) {
        return state.recipes.find(function (x) { return x.id === id; });
      }).filter(Boolean);
      var names = planRecipes.map(function (r) { return r.name; });
      var missing = (plan.recipe_ids || []).length - names.length;

      var card = el("div", { class: "card" }, [
        el("h3", {}, [text(label)]),
        el("div", { class: "meta" }, [
          text(names.length + " rätt" + (names.length === 1 ? "" : "er") + (missing ? " · " + missing + " borttaget recept" + (missing === 1 ? "" : "en") : ""))
        ]),
        el("div", { class: "tagrow" }, planRecipes.map(function (r) {
          return el("button", { class: "tagchip", onclick: function () { openDetailModal(r); } }, [text(r.name)]);
        })),
        el("div", { class: "actions" }, [
          names.length
            ? el("button", { class: "btn small primary", onclick: function () { reusePlan(plan); } }, [text("Återanvänd den här veckan")])
            : el("button", { class: "btn small primary", disabled: "disabled" }, [text("Inga recept kvar")]),
          el("button", { class: "btn small danger", onclick: function () { deletePlan(plan); } }, [text("Ta bort")])
        ])
      ]);
      host.appendChild(card);
    });

  function reusePlan(plan) {
    var validIds = (plan.recipe_ids || []).filter(function (id) {
      return state.recipes.some(function (r) { return r.id === id; });
    });
    if (!validIds.length) return;
    state.selected = new Set(validIds);
    state.activeTab = "week";
    render();
    var input = $("#weekStartInput");
    if (input) input.value = toISODate(mondayOf(new Date()));
    window.scrollTo({ top: 0, behavior: "smooth" });
    showBanner("info", "Recepten är valda igen. Sätt veckostart och spara för att lägga till en ny post i historiken.");
  }

  function deletePlan(plan) {
    var host = $("#modalRoot");
    host.innerHTML = "";
    var label = weekRangeLabel(plan.week_start) || plan.week_label || "veckoplanen";
    host.appendChild(el("div", { class: "modal-backdrop", onclick: function (e) { if (e.target === host.firstChild) host.innerHTML = ""; } }, [
      el("div", { class: "modal" }, [
        el("h2", {}, [text("Ta bort " + label + "?")]),
        el("p", { style: "color:var(--text-muted);font-size:0.9rem;" }, [text("Det går inte att ångra. Själva recepten påverkas inte.")]),
        el("div", { class: "modal-actions" }, [
          el("button", { class: "btn", onclick: function () { host.innerHTML = ""; } }, [text("Avbryt")]),
          el("button", {
            class: "btn danger", onclick: function () {
              apiFetch("/weekly_plans?id=eq." + plan.id, { method: "DELETE" })
                .then(function () {
                  state.plans = state.plans.filter(function (p) { return p.id !== plan.id; });

  function deleteRecipe(r) {

    var host = $("#modalRoot");
    host.innerHTML = "";
    host.appendChild(el("div", { class: "modal-backdrop", onclick: function (e) { if (e.target === host.firstChild) host.innerHTML = ""; } }, [
      el("div", { class: "modal" }, [
        el("h2", {}, [text("Ta bort " + r.name + "?")]),
        el("p", { style: "color:var(--text-muted);font-size:0.9rem;" }, [text("Det går inte att ångra.")]),

  // ---------- modal: visa recept (read-only) ----------

  function openDetailModal(r) {
    var host = $("#modalRoot");
    host.innerHTML = "";

    var ingredients = (r.recipe_ingredients || []).slice().sort(function (a, b) { return a.sort_order - b.sort_order; });

    // Ingredienser utan grupp (huvudreceptet) visas i en vanlig lista.
    // Ingredienser med en group_name (t.ex. "Aioli", tolkat ur receptet
    // eller angivet för hand) visas i en egen mini-lista med rubrik, i den
    // ordning grupperna först dyker upp bland ingredienserna.
    function ingLi(i) {
      var parts = [];
      if (i.amount !== null && i.amount !== undefined) parts.push(Math.round(i.amount * 100) / 100);
      if (i.unit) parts.push(i.unit);
      parts.push(i.name);
      return el("li", {}, [text(parts.join(" "))]);
    }
    var ungrouped = ingredients.filter(function (i) { return !i.group_name; });
    var groupNames = [];
    ingredients.forEach(function (i) {
      if (i.group_name && groupNames.indexOf(i.group_name) === -1) groupNames.push(i.group_name);
    });
    var ingBlocks = [];
    if (ungrouped.length) ingBlocks.push(el("ul", {}, ungrouped.map(ingLi)));
    groupNames.forEach(function (g) {
      var items = ingredients.filter(function (i) { return i.group_name === g; });
      ingBlocks.push(el("div", { class: "ing-group-label" }, [text(g)]));
      ingBlocks.push(el("ul", {}, items.map(ingLi)));
    });

    var tagsRow = el("div", { class: "tagrow" }, (r.tags || []).map(function (t) {
      return el("span", { class: "tagchip static" }, [text(t)]);
    }));

    // Instruktioner: ett steg per rad i databasen, men visas som en
    // punktlista i stället för en löpande text — lättare att följa steg för steg.
    // Plockar även bort ev. egen radnumrering ("1.", "2)", "- ") källan eller
    // AI-tolkningen kan ha lagt till, så det inte dyker upp dubbla markörer.
    var instructionSteps = (r.instructions || "")
      .split("\n")
      .map(function (line) { return line.replace(/^\s*(?:\d+[.)]|[-*•])\s+/, "").trim(); })
      .filter(Boolean);
    var instructionsEl;
    if (instructionSteps.length > 1) {
      instructionsEl = el("div", { class: "instructions" }, [
        el("ul", {}, instructionSteps.map(function (step) { return el("li", {}, [text(step)]); }))
      ]);
    } else if (instructionSteps.length === 1) {
      instructionsEl = el("div", { class: "instructions" }, [text(instructionSteps[0])]);
    } else {
      instructionsEl = el("p", { style: "color:var(--text-muted);font-size:0.9rem;" }, [text("Inga instruktioner sparade.")]);
    }

    var modalChildren = [
      el("h2", {}, [text(r.name)])
    ];
    if (r.image_url) modalChildren.push(el("img", { class: "detail-img", src: r.image_url, alt: r.name }));
    modalChildren.push(tagsRow);
    modalChildren.push(el("div", { class: "detail-cols" }, [
      el("div", {}, [
        el("h3", {}, [text("Ingredienser")]),
        ingredients.length ? el("div", {}, ingBlocks) : el("p", { style: "color:var(--text-muted);font-size:0.9rem;" }, [text("Inga ingredienser sparade.")])
      ]),
      el("div", {}, [
        el("h3", {}, [text("Tillagning")]),
        instructionsEl
      ])
    ]));
    modalChildren.push(el("div", { class: "detail-notes" }, [
      el("h3", {}, [text("Anteckningar")]),
      r.notes
        ? el("p", {}, [text(r.notes)])
        : el("p", { style: "color:var(--text-muted);font-size:0.9rem;" }, [text("Inga anteckningar sparade.")])
    ]));
    modalChildren.push(el("div", { class: "modal-actions" }, [
      el("span"),
      el("div", { class: "right" }, [
        el("button", { class: "btn", onclick: function () { host.innerHTML = ""; } }, [text("Stäng")])
      ])
    ]));

    var modal = el("div", { class: "modal detail-modal" }, modalChildren);
    host.appendChild(el("div", { class: "modal-backdrop", onclick: function (e) { if (e.target.classList.contains("modal-backdrop")) host.innerHTML = ""; } }, [modal]));
  }

  // ---------- modal: add/edit recipe ----------

  var formIngredients = [];
  var formIdCounter = 0;

  function openNewModal() {
    formIngredients = [{ _id: formIdCounter++, name: "", amount: "", unit: "", category: "Övrigt", group: "" }];
    renderModal(null);
  }
  function openEditModal(r) {
    formIngredients = (r.recipe_ingredients || []).slice().sort(function (a, b) { return a.sort_order - b.sort_order; }).map(function (i) {
      return { _id: formIdCounter++, name: i.name, amount: i.amount === null ? "" : i.amount, unit: i.unit || "", category: i.category || "Övrigt", group: i.group_name || "" };
    });
    if (!formIngredients.length) formIngredients = [{ _id: formIdCounter++, name: "", amount: "", unit: "", category: "Övrigt", group: "" }];
    renderModal(r);
  }

  function renderModal(editingRecipe) {
    var host = $("#modalRoot");
    host.innerHTML = "";

    var nameInput = el("input", { type: "text", value: editingRecipe ? editingRecipe.name : "", placeholder: "t.ex. Tacopanna" });
    var tagsInput = el("input", { type: "text", value: editingRecipe ? (editingRecipe.tags || []).join(", ") : "", placeholder: "t.ex. vardag, snabb, barnvänlig" });
    var notesInput = el("textarea", { placeholder: "Egna anteckningar, tips…" });
    notesInput.value = editingRecipe ? (editingRecipe.notes || "") : "";
    var instructionsInput = el("textarea", { placeholder: "Steg för steg, t.ex.\n1. Hacka löken…\n2. Fräs i olja…", rows: 6 });
    instructionsInput.value = editingRecipe ? (editingRecipe.instructions || "") : "";
    var urlInput = el("input", { type: "text", value: editingRecipe ? (editingRecipe.source_url || "") : "", placeholder: "Länk till recept (valfritt)" });

    // ---- Bild på receptet: auto från länk-import, eller manuell uppladdning ----
    var imageUrlState = editingRecipe ? (editingRecipe.image_url || null) : null;
    var imgPreview = el("img", { class: "preview" });
    var imgPreviewEmpty = el("div", { class: "preview empty" }, [text("Ingen bild")]);
    var imgFileInput = el("input", { type: "file", accept: "image/*" });
    var imgStatus = el("span", { style: "font-size:0.78rem;color:var(--text-muted);" }, []);
    var imgRemoveBtn = el("button", { type: "button", class: "btn small" }, [text("Ta bort bild")]);

    function renderImgPreview() {
      if (imageUrlState) {
        imgPreview.src = imageUrlState;
        imgPreview.style.display = "";
        imgPreviewEmpty.style.display = "none";
        imgRemoveBtn.style.display = "";
      } else {
        imgPreview.style.display = "none";
        imgPreviewEmpty.style.display = "";
        imgRemoveBtn.style.display = "none";
      }
    }
    renderImgPreview();

    imgRemoveBtn.addEventListener("click", function () {
      imageUrlState = null;
      renderImgPreview();
    });

    imgFileInput.addEventListener("change", function () {
      var file = imgFileInput.files && imgFileInput.files[0];
      if (!file) return;
      imgStatus.textContent = "Laddar upp…";
      imgFileInput.disabled = true;
      uploadRecipeImage(file)
        .then(function (url) {
          imageUrlState = url;
          renderImgPreview();
          imgStatus.textContent = "";
          imgFileInput.disabled = false;
          imgFileInput.value = "";
        })
        .catch(function (err) {
          imgStatus.textContent = "";
          imgFileInput.disabled = false;
          showBanner("error", "Kunde inte ladda upp bilden. " + err.message);
        });
    });

    var imgField = el("div", { class: "field" }, [
      el("label", {}, [text("Bild")]),
      el("div", { class: "img-field" }, [
        imgPreview,
        imgPreviewEmpty,
        el("div", { class: "controls" }, [imgFileInput, imgStatus, imgRemoveBtn])
      ])
    ]);

    // ---- Betyg (grisnosar) — staged lokalt och sparas med resten av formuläret ----
    var ratingSannaState = editingRecipe ? (editingRecipe.rating_sanna || null) : null;
    var ratingAntonState = editingRecipe ? (editingRecipe.rating_anton || null) : null;
    var ratingField = el("div", { class: "field" }, [
      el("label", {}, [text("Betyg")]),
      el("div", { class: "rating" }, [
        renderRatingRow("Sanna", function () { return ratingSannaState; }, function (newVal, redraw) {
          ratingSannaState = newVal;
          redraw();
        }),
        renderRatingRow("Anton", function () { return ratingAntonState; }, function (newVal, redraw) {
          ratingAntonState = newVal;
          redraw();
        })
      ])
    ]);

    var ingHost = el("div", { class: "field" }, []);
    var ingHead = el("div", { class: "ing-head" }, [
      el("span", {}, [text("Ingrediens")]),
      el("span", {}, [text("Mängd")]),
      el("span", {}, [text("Enhet")]),
      el("span", {}, [text("Kategori")]),
      el("span", {}, [text("Del (valfritt)")]),
      el("span", {}, [])
    ]);
    var ingList = el("div", { style: "display:flex;flex-direction:column;gap:10px;" }, []);

    function renderIngList() {
      ingList.innerHTML = "";
      formIngredients.forEach(function (ing) {
        var nameF = el("input", { type: "text", placeholder: "namn", value: ing.name });
        nameF.addEventListener("input", function () { ing.name = nameF.value; });
        var amtF = el("input", { type: "text", placeholder: "1", value: ing.amount, inputmode: "decimal" });
        amtF.addEventListener("input", function () { ing.amount = amtF.value; });
        var unitF = el("input", { type: "text", placeholder: "dl/g/st", value: ing.unit });
        unitF.addEventListener("input", function () { ing.unit = unitF.value; });
        var catF = el("select", {}, CATEGORIES.map(function (c) {
          var o = el("option", { value: c }, [text(c)]);
          if (c === ing.category) o.setAttribute("selected", "selected");
          return o;
        }));
        catF.addEventListener("change", function () { ing.category = catF.value; });
        var groupF = el("input", { type: "text", placeholder: "t.ex. Aioli", value: ing.group || "" });
        groupF.addEventListener("input", function () { ing.group = groupF.value; });
        var rmBtn = el("button", { type: "button", title: "Ta bort den här ingrediensen", onclick: function () {
          formIngredients = formIngredients.filter(function (x) { return x._id !== ing._id; });
          renderIngList();
        } }, [text("✕ Ta bort")]);
        ingList.appendChild(el("div", { class: "ing-row" }, [nameF, amtF, unitF, catF, groupF, rmBtn]));
      });
    }
    renderIngList();

    var addIngBtn = el("button", { type: "button", class: "btn small", onclick: function () {
      formIngredients.push({ _id: formIdCounter++, name: "", amount: "", unit: "", category: "Övrigt", group: "" });
      renderIngList();
    } }, [text("+ Lägg till ingrediens")]);

    ingHost.appendChild(el("label", {}, [text("Ingredienser")]));
    ingHost.appendChild(ingHead);
    ingHost.appendChild(ingList);
    ingHost.appendChild(addIngBtn);

    var saveBtn = el("button", { class: "btn primary", onclick: function () {
      submitRecipe(editingRecipe, nameInput, tagsInput, notesInput, urlInput, instructionsInput,
        function () { return imageUrlState; },
        function () { return ratingSannaState; },
        function () { return ratingAntonState; });
    } }, [text(editingRecipe ? "Spara ändringar" : "Spara recept")]);
    var cancelBtn = el("button", { class: "btn", onclick: function () { host.innerHTML = ""; } }, [text("Avbryt")]);

    // ---- AI-import: fyller i formuläret ovan, sparar inget själv ----
    var importUrlInput = el("input", { type: "text", placeholder: "Klistra in en receptlänk…" });
    var importUrlBtn = el("button", { type: "button", class: "btn small" }, [text("Hämta från länk")]);
    var importFileInput = el("input", { type: "file", accept: "image/*" });
    var importStatus = el("span", { style: "font-size:0.78rem;color:var(--text-muted);" }, []);

    function setImportBusy(busy, msg) {
      importUrlBtn.disabled = busy;
      importFileInput.disabled = busy;
      importStatus.textContent = busy ? (msg || "Tolkar recept…") : "";
    }

    function applyImportedRecipe(data) {
      if (data.name) nameInput.value = data.name;
      if (Array.isArray(data.tags) && data.tags.length) tagsInput.value = data.tags.join(", ");
      if (Array.isArray(data.ingredients) && data.ingredients.length) {
        formIngredients = data.ingredients.map(function (i) {
          return {
            _id: formIdCounter++,
            name: i.name || "",
            amount: (i.amount === null || i.amount === undefined || i.amount === "") ? "" : i.amount,
            unit: i.unit || "",
            category: CATEGORIES.indexOf(i.category) !== -1 ? i.category : "Övrigt",
            group: (typeof i.group === "string" && i.group.trim()) ? i.group.trim() : ""
          };
        });
        renderIngList();
      }
      if (typeof data.instructions === "string" && data.instructions.trim()) {
        instructionsInput.value = data.instructions.trim();
      }
      // Bara satt vid länk-import (se import-recipe Edge Function) — en
      // uppladdad egen bild ska aldrig skrivas över automatiskt.
      if (data.image_url) {
        imageUrlState = data.image_url;
        renderImgPreview();
      }
      showBanner("info", "Receptet är tolkat — kontrollera att allt stämmer innan du sparar.");
    }

    importUrlBtn.addEventListener("click", function () {
      var url = importUrlInput.value.trim();
      if (!url) { showBanner("error", "Klistra in en länk först."); return; }
      urlInput.value = url;
      setImportBusy(true, "Hämtar och tolkar sidan…");
      callImportFunction({ url: url })
        .then(function (data) { setImportBusy(false); applyImportedRecipe(data); })
        .catch(function (err) { setImportBusy(false); showBanner("error", "Kunde inte tolka länken. " + err.message); });
    });

    importFileInput.addEventListener("change", function () {
      var file = importFileInput.files && importFileInput.files[0];
      if (!file) return;
      setImportBusy(true, "Läser skärmdumpen…");
      resizeImageToBase64(file, 1400)
        .then(function (img) { return callImportFunction({ image: img.base64, mediaType: img.mediaType }); })
        .then(function (data) { setImportBusy(false); applyImportedRecipe(data); importFileInput.value = ""; })
        .catch(function (err) { setImportBusy(false); showBanner("error", "Kunde inte tolka bilden. " + err.message); importFileInput.value = ""; });
    });

    var importSection = el("div", { class: "field", style: "background:var(--surface-2);border-radius:10px;padding:12px;gap:10px;" }, [
      el("label", {}, [text("Importera automatiskt med AI")]),
      el("div", { style: "display:flex;gap:6px;flex-wrap:wrap;" }, [importUrlInput, importUrlBtn]),
      el("div", { style: "display:flex;gap:8px;align-items:center;flex-wrap:wrap;" }, [importFileInput, importStatus])
    ]);

    var modal = el("div", { class: "modal" }, [
      el("h2", {}, [text(editingRecipe ? "Redigera recept" : "Nytt recept")]),
      importSection,
      el("div", { class: "field" }, [el("label", {}, [text("Namn")]), nameInput]),
      imgField,
      ratingField,
      el("div", { class: "field" }, [el("label", {}, [text("Taggar (kommaseparerade)")]), tagsInput]),
      ingHost,
      el("div", { class: "field" }, [el("label", {}, [text("Tillagning")]), instructionsInput]),
      el("div", { class: "field" }, [el("label", {}, [text("Anteckningar")]), notesInput]),
      el("div", { class: "field" }, [el("label", {}, [text("Receptlänk")]), urlInput]),
      el("div", { class: "modal-actions" }, [
        el("span"),
        el("div", { class: "right" }, [cancelBtn, saveBtn])
      ])
    ]);

    host.appendChild(el("div", { class: "modal-backdrop", onclick: function (e) { if (e.target.classList.contains("modal-backdrop")) host.innerHTML = ""; } }, [modal]));
  }

  function submitRecipe(editingRecipe, nameInput, tagsInput, notesInput, urlInput, instructionsInput, getImageUrl, getRatingSanna, getRatingAnton) {
    var name = nameInput.value.trim();
    if (!name) { showBanner("error", "Receptet behöver ett namn."); return; }
    var tags = tagsInput.value.split(",").map(function (t) { return t.trim(); }).filter(Boolean);
    var cleanedIngredients = formIngredients
      .filter(function (i) { return i.name.trim(); })
      .map(function (i, idx) {
        var amt = i.amount === "" || i.amount === null || i.amount === undefined ? null : Number(String(i.amount).replace(",", "."));
        var unit = i.unit.trim();
        // Om en mängd är satt men ingen enhet, räkna som "st" (se buildShoppingList)
        // så att samma ingrediens från olika recept slås ihop i inköpslistan.
        if (!unit && !isNaN(amt) && amt !== null) unit = "st";
        var group = (i.group || "").trim();
        return { name: i.name.trim(), amount: isNaN(amt) ? null : amt, unit: unit || null, category: i.category || "Övrigt", group_name: group || null, sort_order: idx };
      });

    var payload = {
      name: name,
      tags: tags,
      notes: notesInput.value.trim() || null,
      source_url: urlInput.value.trim() || null,
      instructions: instructionsInput.value.trim() || null,
      image_url: (typeof getImageUrl === "function" ? getImageUrl() : null) || null,
      rating_sanna: (typeof getRatingSanna === "function" ? getRatingSanna() : null) || null,
      rating_anton: (typeof getRatingAnton === "function" ? getRatingAnton() : null) || null
    };

    var chain;
    if (editingRecipe) {
      chain = apiFetch("/recipes?id=eq." + editingRecipe.id, { method: "PATCH", headers: { Prefer: "return=representation" }, body: payload })
        .then(function () { return apiFetch("/recipe_ingredients?recipe_id=eq." + editingRecipe.id, { method: "DELETE" }); })
        .then(function () {
          if (!cleanedIngredients.length) return null;
          var withRecipe = cleanedIngredients.map(function (i) { return Object.assign({ recipe_id: editingRecipe.id }, i); });
          return apiFetch("/recipe_ingredients", { method: "POST", body: withRecipe });
        })
        .then(function () { return loadRecipes(); });
    } else {
      chain = apiFetch("/recipes", { method: "POST", headers: { Prefer: "return=representation" }, body: payload })
        .then(function (created) {
          var recipe = created[0];
          if (!cleanedIngredients.length) return null;
          var withRecipe = cleanedIngredients.map(function (i) { return Object.assign({ recipe_id: recipe.id }, i); });
          return apiFetch("/recipe_ingredients", { method: "POST", body: withRecipe });
        })
        .then(function () { return loadRecipes(); });
    }

    chain
      .then(function () { $("#modalRoot").innerHTML = ""; })
      .catch(function (err) { showBanner("error", "Kunde inte spara receptet. " + err.message); });
  }

  // ---------- wire up ----------

  document.querySelectorAll("nav.tabs button").forEach(function (b) {
    b.addEventListener("click", function () { state.activeTab = b.getAttribute("data-tab"); render(); });
  });
  $("#recipeSearch").addEventListener("input", function (e) { state.recipeSearch = e.target.value; renderRecipesPanel(); });
  $("#recipeSort").addEventListener("change", function (e) { state.recipeSort = e.target.value; renderRecipesPanel(); });
  $("#weekSearch").addEventListener("input", function (e) { state.weekSearch = e.target.value; renderWeekPanel(); });
  $("#resetWeekBtn").addEventListener("click", resetWeekSelection);
  $("#newRecipeBtn").addEventListener("click", openNewModal);
  $("#copyListBtn").addEventListener("click", copyShoppingList);
  $("#savePlanBtn").addEventListener("click", savePlan);
  $("#weekStartInput").value = state.weekStart;

  loadRecipes();
  loadPlans();
})();
</script>
</body>
</html>
